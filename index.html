        <div class="brand-details">
          <span class="brand-title">GOSH</span>
          <span class="brand-subtitle">Private Ecosystem</span>
        </div>

      <div class="header-center">
        <div class="security-indicator" id="security-indicator" title="P2P & Cloud Security Verified">
          <span class="status-dot"></span>
          <span>Encrypted Channel</span>
        </div>
      </div>

      <div class="header-actions">

        </button>

        <a href="#profile" class="user-avatar-badge" id="header-avatar" title="Profile & Account">
          U

      </div>

  <!-- App Bootstrapper -->

  <!-- Offline PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[GOSH PWA] Service worker registration non-blocking:', err);
        });
      });
    }
