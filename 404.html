<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOSH — Redirecting...</title>
  <script>
    // Single Page App redirect for GitHub Pages direct navigation
    const path = window.location.pathname;
    const repoMatch = path.match(/^(\/[^\/]+)?\/(.+)$/);
    // Redirect non-hash routes to hash-based router
    if (window.location.hash) {
      window.location.replace('./');
    } else {
      const segments = path.split('/').filter(Boolean);
      const lastSegment = segments[segments.length - 1];
      if (lastSegment && !lastSegment.includes('.')) {
        window.location.replace('./#' + lastSegment);
      } else {
        window.location.replace('./');
      }
    }
  </script>
</head>
<body style="background: #0d060e; color: #faf5f0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <p style="margin: 0; font-size: 0.9rem; color: #e08da3;">Resuming GOSH session...</p>
  </div>
</body>
</html>
